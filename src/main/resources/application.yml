server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ${SERVICE_NAME:hub-service}
  #  profiles:
  #    active: local
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        impl.uuid_binary_compatibility: true
  # Redis 설정, Redis 사용하지 않을 시 주석처리
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 3000
            logger-level: basic

message:
  exchange: baekma.exchange # Producer만 적용
  queue:
    order: order.queue
    delivery: delivery.queue
    hub: hub.queue
    notification: notification.queue
    company: company.queue
  binding-key:
    notification:
      inventory-low: hub.inventory.low
      order-created: order.created
      order-canceled: order.canceled
      order-completed: order.completed
    hub:
      route-changed: hub.route.changed
    company:
      hub-deleted: hub.deleted
    order:
      inventory-deducted: hub.inventory.deducted
      inventory-deduct-failed: hub.inventory.deduct.failed
      inventory-restored: hub.inventory.restored
      inventory-restore-failed: hub.inventory.restore.failed
      delivery-created: delivery.created
      delivery-create-failed: delivery.create.failed
      delivery-canceled: delivery.canceled
      delivery-cancel-failed: delivery.cancel.failed
  outbox:
    publish-delay-ms: 5000

hub:
  graph:
    sync-interval-ms: 10000

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_SERVER:http://localhost:9411/api/v2/spans}

  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents

  endpoint:
    health:
      show-details: always

  health:
    circuitbreakers:
      enabled: true

springdoc:
  api-docs:
    path: /api/api-spec
    enabled: true
  swagger-ui:
    path: /api/api-docs
    enabled: true
  override-with-generic-response: false
  use-fqn: true

naver:
  maps:
    client-id: ${NAVER_MAP_CLIENT_ID}
    client-secret: ${NAVER_MAP_CLIENT_SECRET}
    url: ${NAVER_MAP_URL}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-failure-predicate: com.sparta.logistics.infrastructure.feign.resilience.FeignCircuitBreakerFailurePredicate

  timelimiter:
    configs:
      default:
        timeout-duration: 6s

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

performance:
  shortest-path-cache:
    enabled: ${SHORTEST_PATH_CACHE_ENABLED:true}